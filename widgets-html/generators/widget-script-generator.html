<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Widget Script Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #f3f7fb;
      --panel: #ffffff;
      --text: #111827;
      --muted: #667085;
      --line: #d9e2ec;
      --accent: #d81d24;
      --accent-strong: #ba1b21;
      --accent-soft: #fdecee;
      --code-bg: #111827;
      --code-text: #d7fbe8;
      --shadow: 0 18px 42px rgba(15, 23, 42, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(216, 29, 36, 0.16), transparent 30rem),
        linear-gradient(135deg, #f8fafc 0%, var(--bg) 100%);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0;
    }

    .header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-family: "Teko", "Inter", sans-serif;
      font-size: clamp(2.4rem, 6vw, 4.6rem);
      line-height: 0.9;
      letter-spacing: 0;
    }

    .header p {
      max-width: 620px;
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 420px) 1fr;
      gap: 18px;
      align-items: start;
      transition: grid-template-columns 0.24s ease;
    }

    .layout.preview-focus {
      grid-template-columns: 1fr;
    }

    .layout.preview-focus .form-panel {
      display: none;
    }

    .layout.preview-focus .output-panel {
      width: 100%;
    }

    .panel {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(217, 226, 236, 0.9);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .form-panel {
      position: sticky;
      top: 18px;
      padding: 18px;
    }

    .output-panel {
      overflow: hidden;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    label {
      color: #344054;
      font-size: 0.82rem;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #ffffff;
      color: var(--text);
      padding: 11px 12px;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: rgba(216, 29, 36, 0.45);
      box-shadow: 0 0 0 4px rgba(216, 29, 36, 0.12);
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .button {
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.18s ease;
    }

    .button:hover {
      background: var(--accent-strong);
      transform: translateY(-1px);
    }

    .button.secondary {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--accent-strong);
    }

    .button.secondary:hover {
      background: var(--accent-soft);
    }

    .status {
      min-height: 20px;
      margin-top: 12px;
      color: var(--accent-strong);
      font-size: 0.86rem;
      font-weight: 700;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(248, 250, 252, 0.86);
    }

    .tab {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 12px;
      background: #fff;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 800;
      cursor: pointer;
    }

    .tab.active {
      border-color: rgba(216, 29, 36, 0.35);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    .code-wrap,
    .preview-wrap {
      display: none;
      padding: 16px;
    }

    .code-wrap.active,
    .preview-wrap.active {
      display: block;
    }

    pre {
      min-height: 520px;
      margin: 0;
      overflow: auto;
      border-radius: 14px;
      background: var(--code-bg);
      color: var(--code-text);
      padding: 18px;
      font-size: 0.86rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .preview-frame {
      width: 100%;
      height: 520px;
      min-height: 260px;
      max-height: calc(100vh - 170px);
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
    }

    @media (max-width: 920px) {
      .header {
        display: block;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .form-panel {
        position: static;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <h1>Widget Script Generator</h1>
        <p>Buat snippet embed untuk setiap Arbiter widget. Pilih widget, ubah key dan options, lalu salin kode yang dihasilkan.</p>
      </div>
    </header>

    <section class="layout">
      <form class="panel form-panel" id="generator-form">
        <div class="field">
          <label for="widget-type">Widget</label>
          <select id="widget-type"></select>
        </div>

        <div class="field">
          <label for="script-src">Script URL</label>
          <input id="script-src" type="url" placeholder="https://..." />
        </div>

        <div class="field">
          <label for="target-id">Target ID</label>
          <input id="target-id" type="text" />
        </div>

        <div class="field">
          <label for="api-key">Key</label>
          <input id="api-key" type="text" />
        </div>

        <div class="field">
          <label for="options-json">Options JSON</label>
          <textarea id="options-json" spellcheck="false"></textarea>
        </div>

        <div class="actions">
          <button class="button" type="button" id="copy-code">Copy Code</button>
          <button class="button secondary" type="button" id="refresh-preview">Refresh Preview</button>
          <button class="button secondary" type="button" id="reset-saved">Reset Saved</button>
        </div>
        <div class="status" id="status"></div>
      </form>

      <section class="panel output-panel">
        <div class="tabs" role="tablist" aria-label="Generator output">
          <button class="tab active" type="button" data-panel="code">Code</button>
          <button class="tab" type="button" data-panel="preview">Preview</button>
        </div>
        <div class="code-wrap active" id="code-panel">
          <pre><code id="generated-code"></code></pre>
        </div>
        <div class="preview-wrap" id="preview-panel">
          <iframe class="preview-frame" id="preview-frame" title="Widget preview"></iframe>
        </div>
      </section>
    </section>
  </main>

  <script>
    const LOCAL_DB_KEY = "arbiterWidgetGeneratorLocalDb.v1";
    const PREVIEW_UPDATE_DELAY = 350;

    const widgetTemplates = {
      scoreTicker: {
        label: "Score Ticker",
        globalName: "ArbiterScoreTicker",
        scriptSrc: "https://widget.arbitersports-beta.com/widgets/v1/arbiter-score-ticker.iife.js",
        targetId: "arbiter-score-ticker-widget",
        key: "C5050393-1B76-4672-B12D-C5323EC06E33",
        options: {
          today: "2026-03-10",
          vertical: false,
          hideLocation: false
        }
      },
      schedule: {
        label: "Schedule Widget",
        globalName: "ArbiterScheduleWidget",
        scriptSrc: "https://widget.arbitersports.com/widgets/v1/arbiter-schedule-widget.iife.js",
        targetId: "arbiter-schedule-widget-frontiers",
        key: "5f830574-d34c-4ed5-b3d9-3f48d012d278",
        options: {
          sportId: 4,
          genderId: 1,
          scrollEnabled: true,
          todayForward: false,
          primaryColor: "#1E40AF"
        }
      },
      calendar: {
        label: "Calendar Widget",
        globalName: "ArbiterCalendarWidget",
        scriptSrc: "https://arbiter-widget.vercel.app/beta/widgets/v1/arbiter-calendar-widget-beta.iife.js",
        targetId: "arbiter-calendar-widget",
        key: "ad337b94-a28d-440b-93d6-d9faa8a5223e",
        options: {
          today: "2026-01-06",
          primaryColor: "#0b1c3d",
          secondaryColor: "#FFFFFF",
          defaultView: "month",
          defaultDisplayMode: "details",
          firstDayOfWeek: 0,
          maxEventsPerDay: 4,
          sportId: 4,
          genderId: 2
        }
      },
      roster: {
        label: "Roster Widget",
        globalName: "ArbiterRosterWidget",
        scriptSrc: "https://cdn.jsdelivr.net/gh/echolist/Testing@master/arbiter-roster-widget-20260318-1.iife.js",
        targetId: "arbiter-roster-state-widget",
        key: "D772A8A1-515B-4394-9D28-AAC031CEE451",
        options: {
          sportId: 29,
          genderId: 1,
          levelId: 1,
          title: "Golf Boys Varsity",
          defaultSort: [
            { field: "class", direction: "desc" },
            { field: "jersey", direction: "asc" }
          ],
          hideBranding: true,
          primaryColor: "#0057b8",
          mainLogoUrl: "https://sectionv.org/common/controls/image_handler.aspx?thumb_id=15&image_path=/images/2019/5/8/boys_golf_logo.png",
          titlePosition: "2"
        }
      },
      upcoming: {
        label: "Upcoming Game Widget",
        globalName: "ArbiterUpcomingWidget",
        scriptSrc: "https://arbiter-widget.vercel.app/beta/widgets/v1/arbiter-upcoming-widget.iife.js",
        targetId: "arbiter-widget",
        key: "718BBC86-6242-4F6C-AC1A-B13512FDE29B",
        options: {
          title: "Upcoming Games",
          scrollEnabled: true,
          height: 600,
          hideBranding: true,
          hideFilter: false,
          primaryColor: "#0057b8",
          secondaryColor: "#f0f7ff",
          maxEvents: 11
        }
      }
    };

    const widgetType = document.querySelector("#widget-type");
    const layout = document.querySelector(".layout");
    const scriptSrc = document.querySelector("#script-src");
    const targetId = document.querySelector("#target-id");
    const apiKey = document.querySelector("#api-key");
    const optionsJson = document.querySelector("#options-json");
    const generatedCode = document.querySelector("#generated-code");
    const copyCode = document.querySelector("#copy-code");
    const refreshPreview = document.querySelector("#refresh-preview");
    const resetSaved = document.querySelector("#reset-saved");
    const previewFrame = document.querySelector("#preview-frame");
    const status = document.querySelector("#status");
    const tabs = document.querySelectorAll(".tab");
    const formPanel = document.querySelector(".form-panel");
    const codePanel = document.querySelector("#code-panel");
    const previewPanel = document.querySelector("#preview-panel");

    Object.entries(widgetTemplates).forEach(([value, template]) => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = template.label;
      widgetType.append(option);
    });

    let previewTimer = null;

    function readLocalDb() {
      try {
        return JSON.parse(localStorage.getItem(LOCAL_DB_KEY) || "{}");
      } catch (error) {
        return {};
      }
    }

    function writeLocalDb(db) {
      try {
        localStorage.setItem(LOCAL_DB_KEY, JSON.stringify(db));
        return true;
      } catch (error) {
        status.textContent = "Local database tidak bisa disimpan oleh browser.";
        return false;
      }
    }

    function currentWidgetState() {
      return {
        scriptSrc: scriptSrc.value,
        targetId: targetId.value,
        key: apiKey.value,
        optionsJson: optionsJson.value
      };
    }

    function savedStateFor(widgetKey) {
      const db = readLocalDb();
      return db[widgetKey] || null;
    }

    function saveCurrentState() {
      const db = readLocalDb();
      db[widgetType.value] = {
        ...currentWidgetState(),
        updatedAt: new Date().toISOString()
      };

      return writeLocalDb(db);
    }

    function clearCurrentSavedState() {
      const db = readLocalDb();
      delete db[widgetType.value];
      writeLocalDb(db);
    }

    function isPreviewActive() {
      return previewPanel.classList.contains("active");
    }

    function syncPreviewLayout(isPreview) {
      layout.classList.toggle("preview-focus", isPreview);
      formPanel.setAttribute("aria-hidden", isPreview ? "true" : "false");
    }

    function schedulePreviewUpdate() {
      if (!isPreviewActive()) return;

      clearTimeout(previewTimer);
      previewTimer = setTimeout(updatePreview, PREVIEW_UPDATE_DELAY);
    }

    function selectedTemplate() {
      return widgetTemplates[widgetType.value];
    }

    function stringifyOptions(options) {
      return JSON.stringify(options, null, 2);
    }

    function loadTemplate() {
      const template = selectedTemplate();
      const savedState = savedStateFor(widgetType.value);

      scriptSrc.value = savedState?.scriptSrc ?? template.scriptSrc;
      targetId.value = savedState?.targetId ?? template.targetId;
      apiKey.value = savedState?.key ?? template.key;
      optionsJson.value = savedState?.optionsJson ?? stringifyOptions(template.options);
      updateCode();
      status.textContent = savedState ? "Parameter dimuat dari local database." : "";
      schedulePreviewUpdate();
    }

    function parseOptions() {
      try {
        status.textContent = "";
        return JSON.parse(optionsJson.value || "{}");
      } catch (error) {
        status.textContent = "Options JSON belum valid.";
        return null;
      }
    }

    function buildCode() {
      const template = selectedTemplate();
      const cleanTargetId = targetId.value.trim().replace(/^#/, "");
      const cleanScriptSrc = scriptSrc.value.trim();
      const options = parseOptions();

      if (!options) {
        return generatedCode.textContent;
      }

      return [
        `<div id="${cleanTargetId}"></div>`,
        cleanScriptSrc
          ? `<script src="${cleanScriptSrc}"><\/script>`
          : `<!-- Masukkan script URL ${template.label} di sini -->`,
        `<script>`,
        `  ${template.globalName}.init({`,
        `    target: "#${cleanTargetId}",`,
        `    key: "${apiKey.value.trim()}",`,
        `    options: ${stringifyOptions(options).replace(/\n/g, "\n    ")}`,
        `  });`,
        `<\/script>`
      ].join("\n");
    }

    function updateCode() {
      generatedCode.textContent = buildCode();
    }

    function persistAndUpdate() {
      updateCode();

      const optionsAreValid = parseOptions() !== null;

      if (saveCurrentState() && optionsAreValid) {
        status.textContent = "Parameter tersimpan otomatis di local database.";
      }

      schedulePreviewUpdate();
    }

    function updatePreview() {
      const code = buildCode();

      previewFrame.srcdoc = `
        <!doctype html>
        <html>
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <style>
              body {
                margin: 0;
                display: block;
                padding: 16px;
                font-family: Inter, Arial, sans-serif;
                overflow-x: hidden;
              }
            </style>
          </head>
          <body>${code}</body>
        </html>
      `;
    }

    function syncPreviewFrameHeight() {
      if (!isPreviewActive()) return;

      const maxHeight = Math.max(320, window.innerHeight - 170);
      let nextHeight = 520;

      try {
        const frameDoc = previewFrame.contentDocument;
        if (frameDoc?.body && frameDoc?.documentElement) {
          const contentHeight = Math.max(
            frameDoc.body.scrollHeight,
            frameDoc.body.offsetHeight,
            frameDoc.documentElement.scrollHeight,
            frameDoc.documentElement.offsetHeight
          );
          nextHeight = Math.min(maxHeight, Math.max(260, contentHeight + 8));
        } else {
          nextHeight = maxHeight;
        }
      } catch (error) {
        nextHeight = maxHeight;
      }

      previewFrame.style.height = `${nextHeight}px`;
    }

    function loadTemplateFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const widget = params.get("widget");

      if (widget && widgetTemplates[widget]) {
        widgetType.value = widget;
      }

      loadTemplate();
    }

    widgetType.addEventListener("change", () => {
      const url = new URL(window.location.href);

      url.searchParams.set("widget", widgetType.value);
      window.history.replaceState({}, "", url);
      loadTemplate();
    });

    [scriptSrc, targetId, apiKey, optionsJson].forEach((field) => {
      field.addEventListener("input", persistAndUpdate);
    });

    copyCode.addEventListener("click", async () => {
      updateCode();

      try {
        await navigator.clipboard.writeText(generatedCode.textContent);
        status.textContent = "Code berhasil dicopy.";
      } catch (error) {
        status.textContent = "Browser tidak mengizinkan copy otomatis.";
      }
    });

    refreshPreview.addEventListener("click", updatePreview);
    previewFrame.addEventListener("load", () => {
      syncPreviewFrameHeight();
      setTimeout(syncPreviewFrameHeight, 250);
      setTimeout(syncPreviewFrameHeight, 900);
    });
    window.addEventListener("resize", syncPreviewFrameHeight);

    resetSaved.addEventListener("click", () => {
      clearCurrentSavedState();
      loadTemplate();
      status.textContent = "Parameter lokal untuk widget ini sudah direset.";
      updatePreview();
    });

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        tabs.forEach((item) => item.classList.remove("active"));
        tab.classList.add("active");

        const isPreview = tab.dataset.panel === "preview";
        codePanel.classList.toggle("active", !isPreview);
        previewPanel.classList.toggle("active", isPreview);
        syncPreviewLayout(isPreview);

        if (isPreview) {
          updatePreview();
          syncPreviewFrameHeight();
        }
      });
    });

    syncPreviewLayout(false);
    loadTemplateFromUrl();
  </script>
</body>
</html>
